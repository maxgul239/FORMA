<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMA</title>
    <!-- Официальный скрипт Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            /* Темная тема по умолчанию */
            --bg: #111215;
            --surface: #191B1F;
            --text: #F8F9FA;
            --text-muted: #868E96;
            --border: #2C2F36;
            --primary: #FF6B00; /* Оранжевый акцент */
            --radius: 12px;
            --card-red: rgba(250, 82, 82, 0.15);
            --card-red-border: rgba(250, 82, 82, 0.3);
            --card-green: rgba(64, 192, 87, 0.15);
            --card-green-border: rgba(64, 192, 87, 0.3);
        }
        
        [data-theme="light"] {
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --text: #212529;
            --text-muted: #868E96;
            --border: #E9ECEF;
            --card-red: rgba(250, 82, 82, 0.08);
            --card-red-border: rgba(250, 82, 82, 0.2);
            --card-green: rgba(64, 192, 87, 0.08);
            --card-green-border: rgba(64, 192, 87, 0.2);
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); padding-bottom: 140px; transition: background-color 0.3s; }
        
        /* Экраны */
        .screen { display: none; padding: 20px; min-height: 100vh; }
        .screen.active { display: block; }
        
        /* Экран входа */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%); }
        .login-box { background: var(--surface); padding: 40px 24px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .login-title { margin: 0 0 12px 0; font-size: 24px; font-weight: 800; }
        .login-slogan { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; min-height: 60px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        .google-btn { background: #FFFFFF; color: #3C4043; border: 1px solid #DADCE0; padding: 12px 24px; border-radius: 20px; font-weight: 600; font-size: 16px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
        
        /* Навигация и Таймер */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--surface); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { color: var(--text-muted); font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; flex: 1; padding: 10px 0; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 20px; }

        .timer-bar { position: fixed; bottom: 60px; left: 0; right: 0; height: 60px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 99; display: none; }
        .timer-info { display: flex; flex-direction: column; }
        .timer-time { font-size: 22px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
        .timer-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .timer-btn { background: var(--text); color: var(--bg); padding: 8px 20px; border-radius: 8px; font-weight: 700; border: none; font-size: 14px; cursor: pointer; }

        /* Календарь */
        .calendar-scroll { display: flex; overflow-x: auto; gap: 12px; margin-bottom: 20px; padding-bottom: 8px; scroll-scrollbar-width: none; }
        .calendar-scroll::-webkit-scrollbar { display: none; }
        .day-chip { padding: 10px 16px; border-radius: 20px; background: var(--surface); color: var(--text-muted); font-weight: 700; white-space: nowrap; border: 1px solid var(--border); cursor: pointer; }
        .day-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .sync-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .sync-dot { width: 8px; height: 8px; background: #51CF66; border-radius: 50%; display: inline-block; }

        /* Карточки упражнений */
        .ex-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); transition: 0.2s; cursor: pointer; position: relative; }
        .ex-card.status-red { background: var(--card-red); border-color: var(--card-red-border); }
        .ex-card.status-green { background: var(--card-green); border-color: var(--card-green-border); }
        
        .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .ex-title { font-weight: 700; font-size: 16px; margin: 0; padding-right: 30px; }
        .ex-badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
        .status-red .ex-badge { background: rgba(250,82,82,0.2); color: #FF6B6B; }
        .status-green .ex-badge { background: rgba(64,192,87,0.2); color: #51CF66; }

        .ex-remove { position: absolute; top: 16px; right: 16px; color: var(--text-muted); font-size: 18px; font-weight: bold; cursor: pointer; background: none; border: none; padding: 4px; }
        
        .ex-history { margin-top: 12px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 12px; }
        .history-row { display: flex; justify-content: space-between; margin-bottom: 6px; }

        /* Кнопки и формы */
        .btn { padding: 14px; border-radius: var(--radius); font-weight: 700; font-size: 15px; text-align: center; border: none; width: 100%; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); outline: none; font-size: 16px; }
        .form-group input:focus { border-color: var(--primary); }

        /* Loaders & Modals */
        #loader { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; flex-direction: column; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 150; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal { background: var(--surface); padding: 24px; border-radius: 20px; width: 90%; max-width: 340px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .modal h3 { margin-top: 0; margin-bottom: 20px; font-size: 18px; }

    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><span id="loader-text">Загрузка данных...</span></div>

    <!-- 1. Экран входа -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2 class="login-title">FORMA</h2>
            <div class="login-slogan" id="slogan-text" onclick="changeSlogan()"></div>
            <button class="google-btn" onclick="authWithGoogle()">
                <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                Войти через Google
            </button>
        </div>
    </div>

    <!-- 2. Анкета -->
    <div id="onboarding-screen" class="screen">
        <div class="header"><h1>Создание профиля</h1></div>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Ваши данные будут надежно сохранены на вашем Google Диске.</p>
        <div class="form-group"><label>Имя</label><input type="text" id="reg-name" placeholder="Как к вам обращаться?"></div>
        <div class="form-group"><label>Возраст</label><input type="number" id="reg-age" placeholder="Лет"></div>
        <div class="form-group"><label>Рост (см)</label><input type="number" id="reg-height" placeholder="Например, 175"></div>
        <div class="form-group"><label>Вес (кг)</label><input type="number" id="reg-weight" placeholder="Например, 75"></div>
        <button class="btn btn-primary" onclick="completeOnboarding()">Начать тренировки</button>
    </div>

    <!-- 3. Календарь (Главный экран) -->
    <div id="calendar-screen" class="screen">
        <div class="header">
            <h1>Тренировки</h1>
            <div class="sync-status" id="sync-indicator"><span class="sync-dot"></span> Облако</div>
        </div>
        
        <div class="calendar-scroll" id="calendar-days">
            <!-- Дни недели генерируются JS -->
        </div>

        <h3 id="current-day-title" style="margin-top: 0; margin-bottom: 16px;">Понедельник</h3>
        <div id="day-exercises-list"></div>
        
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="openAddExerciseModal()">+ Добавить упражнение</button>
    </div>

    <!-- 4. Все упражнения (Стек) -->
    <div id="exercises-screen" class="screen">
        <div class="header"><h1>База упражнений</h1></div>
        <div id="all-exercises-list"></div>
    </div>

    <!-- 5. Настройки -->
    <div id="settings-screen" class="screen">
        <div class="header"><h1>Настройки</h1></div>
        <div class="ex-card">
            <h3 style="margin-top:0;">Оформление</h3>
            <div class="form-group" style="margin:0;">
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="dark">Темная тема</option>
                    <option value="light">Светлая тема</option>
                </select>
            </div>
        </div>
        <div class="ex-card">
            <h3 style="margin-top:0;">Профиль</h3>
            <div class="form-group"><label>Имя</label><input type="text" id="set-name"></div>
            <div class="form-group"><label>Вес (кг)</label><input type="number" id="set-weight"></div>
            <button class="btn btn-primary" onclick="updateProfile()">Обновить данные</button>
        </div>
        <div class="ex-card">
            <p style="font-size: 13px; color: #51CF66; font-weight: bold; margin-top:0;">● Связь с Google Диском активна</p>
            <button class="btn btn-secondary" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <!-- Таймер (Всегда виден кроме логина) -->
    <div class="timer-bar" id="app-timer">
        <div class="timer-info">
            <span class="timer-label">Отдых</span>
            <span class="timer-time" id="timerDisplay">00:00</span>
        </div>
        <button class="timer-btn" id="timerAction" onclick="toggleTimer()">СТАРТ</button>
    </div>

    <!-- Навигация -->
    <div class="nav-bar" id="bottom-nav" style="display: none;">
        <div class="nav-item active" onclick="switchTab('calendar-screen', this)"><span>📅</span>Календарь</div>
        <div class="nav-item" onclick="switchTab('exercises-screen', this)"><span>📚</span>Упражнения</div>
        <div class="nav-item" onclick="switchTab('settings-screen', this)"><span>⚙️</span>Настройки</div>
    </div>

    <!-- Модалка добавления подхода -->
    <div id="set-modal" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Подход</h3>
            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <input type="number" id="modal-weight" placeholder="Вес, кг" style="flex:1; padding: 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; font-size: 16px; text-align: center;">
                <input type="number" id="modal-reps" placeholder="Повторы" style="flex:1; padding: 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; font-size: 16px; text-align: center;">
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="closeModals()">Отмена</button>
                <button class="btn btn-primary" onclick="saveSet()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модалка выбора упражнения в день -->
    <div id="add-ex-modal" class="modal-overlay">
        <div class="modal">
            <h3>Добавить в этот день</h3>
            <div class="form-group">
                <select id="new-ex-select">
                    <!-- Заполняется JS -->
                </select>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="closeModals()">Отмена</button>
                <button class="btn btn-primary" onclick="addExerciseToDay()">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // ТВОЙ РАБОЧИЙ CLIENT ID (Уже вставлен!)
        // =========================================================
        const GOOGLE_CLIENT_ID = '932402711939-e56mamqb7ls024p6j2amcqlnpv5bldtk.apps.googleusercontent.com';
        const DRIVE_FILE_NAME = 'forma_app_data.json';
        
        let accessToken = null;
        let driveFileId = null;
        let activeExercise = null;
        
        const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let currentDay = 'Пн';

        // Структура базы данных по умолчанию
        let appData = {
            profile: {},
            history: {},
            theme: 'dark',
            split: {
                'Пн': ["Жим штанги лежа", "Рычажный жим на грудь", "Трицепс на блоке", "Жим ногами", "Скручивания на пресс"],
                'Вт': ["Вертикальная тяга блока", "Горизонтальная тяга", "Подъем штанги на бицепс"],
                'Ср': [],
                'Чт': ["Наклонный жим гантелей", "Армейский жим", "Махи гантелями в стороны", "Французский жим"],
                'Пт': ["Тяга Т-грифа", "Молотки с гантелями", "Румынская тяга", "Сгибание ног сидя"],
                'Сб': [],
                'Вс': []
            }
        };

        const EXERCISES_DB = [
            "Жим штанги лежа", "Наклонный жим гантелей", "Рычажный жим на грудь", "Сведение рук в кроссовере",
            "Вертикальная тяга блока", "Горизонтальная тяга", "Тяга Т-грифа", "Подтягивания",
            "Армейский жим", "Махи гантелями в стороны", "Махи в кроссовере на заднюю дельту",
            "Подъем штанги на бицепс", "Молотки с гантелями", "Трицепс на блоке", "Французский жим",
            "Приседания со штангой", "Жим ногами", "Румынская тяга", "Сгибание ног сидя", "Скручивания на пресс"
        ].sort();

        // Слоганы
        const slogans = [
            "Дисциплина решает всё.", "Боль — это временно. Результат — навсегда.",
            "Прогресс начинается там, где заканчивается зона комфорта.", "Слабость уходит через пот.",
            "Сравнивай себя только с тем, кем ты был вчера.", "Каждый подход делает тебя лучше."
        ];
        function changeSlogan() { document.getElementById('slogan-text').innerText = slogans[Math.floor(Math.random() * slogans.length)]; }
        changeSlogan();

        // UI Навигация
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            const isMainApp = ['calendar-screen', 'exercises-screen', 'settings-screen'].includes(screenId);
            document.getElementById('bottom-nav').style.display = isMainApp ? 'flex' : 'none';
            document.getElementById('app-timer').style.display = isMainApp ? 'flex' : 'none';
        }

        function switchTab(screenId, element) {
            showScreen(screenId);
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            if(screenId === 'calendar-screen') renderDay();
            if(screenId === 'exercises-screen') renderAllExercises();
            if(screenId === 'settings-screen') fillSettings();
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-select').value = theme;
            appData.theme = theme;
            backgroundSave();
        }

        // ================= GOOGLE API & OAUTH =================
        let tokenClient;
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        syncWithDrive();
                    }
                },
            });

            const savedToken = sessionStorage.getItem('gapi_token');
            if(savedToken) {
                accessToken = savedToken;
                syncWithDrive();
            }
        };

        function authWithGoogle() { tokenClient.requestAccessToken(); }

        function logout() {
            accessToken = null;
            sessionStorage.removeItem('gapi_token');
            appData = { profile: {}, history: {}, split: {}, theme: 'dark' };
            showScreen('login-screen');
        }

        // ================= ЛОГИКА ДИСКА =================
        function showLoader(show, text = 'Загрузка данных...') { 
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = show ? 'flex' : 'none'; 
        }

        function indicateSync() {
            const dot = document.querySelector('.sync-dot');
            dot.style.background = '#FF6B00'; // Оранжевый во время сохранения
            setTimeout(() => { dot.style.background = '#51CF66'; }, 1000); // Зеленый после
        }

        async function syncWithDrive() {
            showLoader(true, 'Поиск профиля в облаке...');
            sessionStorage.setItem('gapi_token', accessToken);
            
            try {
                let query = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
                let searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&spaces=drive`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                let searchData = await searchRes.json();
                
                if (searchData.files && searchData.files.length > 0) {
                    driveFileId = searchData.files[0].id;
                    let fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    let text = await fileRes.text();
                    if(text) {
                        const loadedData = JSON.parse(text);
                        appData = { ...appData, ...loadedData }; // Мержим дефолт с облаком
                    }
                    if(appData.theme) changeTheme(appData.theme);
                    checkDataState();
                } else {
                    checkDataState(); // Направит на онбординг
                }
            } catch (e) {
                console.error("Drive Error:", e);
                alert("Ошибка синхронизации. Проверьте права.");
                logout();
            }
            showLoader(false);
        }

        // Тихое сохранение на фоне
        async function backgroundSave() {
            if (!accessToken) return;
            indicateSync();
            
            const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
            const fileContent = JSON.stringify(appData);
            
            let form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            try {
                if (driveFileId) {
                    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`, {
                        method: 'PATCH', headers: { 'Authorization': `Bearer ${accessToken}` }, body: form
                    });
                } else {
                    let res = await fetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
                        method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}` }, body: form
                    });
                    let data = await res.json();
                    driveFileId = data.id;
                }
            } catch (e) { console.error("Save Error", e); }
        }

        // ================= ЛОГИКА ИНТЕРФЕЙСА =================
        function checkDataState() {
            if (!appData.profile || !appData.profile.name) {
                showScreen('onboarding-screen');
            } else {
                renderCalendarBar();
                showScreen('calendar-screen');
                renderDay();
            }
        }

        function completeOnboarding() {
            const name = document.getElementById('reg-name').value;
            if(!name) return alert("Введите имя");
            
            appData.profile = {
                name: name,
                age: document.getElementById('reg-age').value,
                height: document.getElementById('reg-height').value,
                weight: document.getElementById('reg-weight').value
            };
            showLoader(true, 'Создание файла на Диске...');
            backgroundSave().then(() => {
                showLoader(false);
                checkDataState();
            });
        }

        // Рендер горизонтального календаря
        function renderCalendarBar() {
            const bar = document.getElementById('calendar-days');
            bar.innerHTML = '';
            DAYS.forEach(day => {
                const div = document.createElement('div');
                div.className = `day-chip ${day === currentDay ? 'active' : ''}`;
                div.innerText = day;
                div.onclick = () => { 
                    currentDay = day; 
                    renderCalendarBar(); 
                    renderDay(); 
                };
                bar.appendChild(div);
            });
            document.getElementById('current-day-title').innerText = currentDay;
        }

        // Рендер карточек упражнений (универсальный для Дня и Стека)
        function createExerciseCard(ex, isDayView = false) {
            const history = appData.history[ex] || [];
            const isGreen = history.length > 0;
            
            let historyHtml = '';
            if (isGreen) {
                const last5 = history.slice(-5).reverse();
                historyHtml = '<div class="ex-history">';
                last5.forEach(s => {
                    historyHtml += `<div class="history-row"><span>${new Date(s.date).toLocaleDateString('ru-RU')}</span> <b>${s.w} кг × ${s.r}</b></div>`;
                });
                historyHtml += '</div>';
            }

            let removeBtn = isDayView ? `<button class="ex-remove" onclick="event.stopPropagation(); removeExercise('${ex}')">✕</button>` : '';

            return `
                <div class="ex-card ${isGreen ? 'status-green' : 'status-red'}" onclick="openSetModal('${ex}')">
                    ${removeBtn}
                    <div class="ex-header">
                        <h3 class="ex-title">${ex}</h3>
                        <span class="ex-badge">${isGreen ? '● Освоено' : '● Нет записей'}</span>
                    </div>
                    <div style="font-size:12px; color:var(--text-muted);">${isGreen ? 'Нажмите, чтобы добавить подход' : 'Нажмите для первой записи'}</div>
                    ${historyHtml}
                </div>
            `;
        }

        function renderDay() {
            const list = document.getElementById('day-exercises-list');
            const dayExs = appData.split[currentDay] || [];
            
            if(dayExs.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-weight:600; border: 1px dashed var(--border); border-radius: var(--radius);">Отдых или добавьте упражнения</div>';
            } else {
                list.innerHTML = dayExs.map(ex => createExerciseCard(ex, true)).join('');
            }
        }

        function renderAllExercises() {
            const list = document.getElementById('all-exercises-list');
            list.innerHTML = EXERCISES_DB.map(ex => createExerciseCard(ex, false)).join('');
        }

        // Модалки
        function openSetModal(ex) {
            activeExercise = ex;
            document.getElementById('modal-title').innerText = ex;
            document.getElementById('modal-weight').value = '';
            document.getElementById('modal-reps').value = '';
            document.getElementById('set-modal').style.display = 'flex';
        }

        function openAddExerciseModal() {
            const select = document.getElementById('new-ex-select');
            select.innerHTML = EXERCISES_DB.map(ex => `<option value="${ex}">${ex}</option>`).join('');
            document.getElementById('add-ex-modal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('set-modal').style.display = 'none';
            document.getElementById('add-ex-modal').style.display = 'none';
        }

        // Действия с данными
        function saveSet() {
            const w = parseFloat(document.getElementById('modal-weight').value);
            const r = parseInt(document.getElementById('modal-reps').value);
            if (!w || !r) return alert("Введите вес и повторы");

            if (!appData.history[activeExercise]) appData.history[activeExercise] = [];
            appData.history[activeExercise].push({ date: new Date().toISOString(), w: w, r: r });

            closeModals();
            
            // Обновляем нужный экран
            if(document.getElementById('calendar-screen').classList.contains('active')) renderDay();
            if(document.getElementById('exercises-screen').classList.contains('active')) renderAllExercises();
            
            backgroundSave();
            
            // Авто-рестарт таймера отдыха
            if(timerInterval) { time = 0; }
        }

        function addExerciseToDay() {
            const ex = document.getElementById('new-ex-select').value;
            if(!appData.split[currentDay]) appData.split[currentDay] = [];
            
            if(!appData.split[currentDay].includes(ex)) {
                appData.split[currentDay].push(ex);
                backgroundSave();
            }
            closeModals();
            renderDay();
        }

        function removeExercise(ex) {
            if(confirm(`Убрать "${ex}" из расписания на ${currentDay}? (История подходов останется в Базе)`)) {
                appData.split[currentDay] = appData.split[currentDay].filter(e => e !== ex);
                backgroundSave();
                renderDay();
            }
        }

        function fillSettings() {
            document.getElementById('set-name').value = appData.profile.name || '';
            document.getElementById('set-weight').value = appData.profile.weight || '';
        }

        function updateProfile() {
            appData.profile.name = document.getElementById('set-name').value;
            appData.profile.weight = document.getElementById('set-weight').value;
            backgroundSave();
            alert("Данные профиля обновлены");
        }

        // ================= ТАЙМЕР ОТДЫХА =================
        let timerInterval;
        let time = 0;
        function toggleTimer() {
            const btn = document.getElementById('timerAction');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "СТАРТ";
                btn.style.background = "var(--text)";
                btn.style.color = "var(--bg)";
            } else {
                btn.innerText = "ПАУЗА";
                btn.style.background = "var(--primary)";
                btn.style.color = "white";
                timerInterval = setInterval(() => {
                    time++;
                    let m = Math.floor(time / 60).toString().padStart(2, '0');
                    let s = (time % 60).toString().padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
                }, 1000);
            }
        }
    </script>
</body>
</html>
